name: Ubuntu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang cppcheck

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Start sccache server
        run: |
          if sccache --start-server; then
            echo "SCCACHE_C_LAUNCHER=sccache"   >> "$GITHUB_ENV"
            echo "SCCACHE_CXX_LAUNCHER=sccache" >> "$GITHUB_ENV"
          else
            echo "SCCACHE_C_LAUNCHER="   >> "$GITHUB_ENV"
            echo "SCCACHE_CXX_LAUNCHER=" >> "$GITHUB_ENV"
            echo "::warning::sccache server failed to start (GHA cache unavailable), building without cache"
          fi

      - name: Configure (gcc)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON \
            ${{ env.SCCACHE_C_LAUNCHER   != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0}',   env.SCCACHE_C_LAUNCHER)   || '' }} \
            ${{ env.SCCACHE_CXX_LAUNCHER != '' && format('-DCMAKE_CXX_COMPILER_LAUNCHER={0}', env.SCCACHE_CXX_LAUNCHER) || '' }}

      - name: Configure (clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            ${{ env.SCCACHE_C_LAUNCHER   != '' && format('-DCMAKE_C_COMPILER_LAUNCHER={0}',   env.SCCACHE_C_LAUNCHER)   || '' }} \
            ${{ env.SCCACHE_CXX_LAUNCHER != '' && format('-DCMAKE_CXX_COMPILER_LAUNCHER={0}', env.SCCACHE_CXX_LAUNCHER) || '' }}

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-${{ matrix.compiler }}-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.compiler }}-conan-

      - name: Conan install
        run: |
          mkdir -p build
          cd build
          conan install .. --build=missing -pr:b=default -s build_type=Release

      - name: List CMake presets (diagnostic)
        run: cmake --list-presets || true

      - name: Configure (gcc)
        if: matrix.compiler == 'gcc'
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Configure (clang)
        if: matrix.compiler == 'clang'
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

      - name: sccache stats
        if: always()
        run: sccache --show-stats