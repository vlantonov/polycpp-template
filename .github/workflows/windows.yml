name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: python -m pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force
        shell: bash

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\Conan\conan2\p
          key: ${{ runner.os }}-default-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-default-conan-

      - name: Conan install
        shell: bash
        run: |
          mkdir -p build
          cd build
          conan install .. --build=missing -pr:b=default -s build_type=Release

      - name: List CMake presets (diagnostic)
        shell: bash
        run: cmake --list-presets || true

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: bash
        run: cmake --build build/Release

      - name: Test
        shell: bash
        run: ctest --test-dir build/Release --output-on-failure

      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats