name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  SCCACHE_GHA_ENABLED: "true"
  # Treat GHA cache storage errors as cache-misses instead of fatal failures.
  # Prevents sccache from crashing the build when the cache backend is
  # temporarily unavailable (e.g. HTTP 400 from artifactcache.actions.githubusercontent.com).
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-default-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-default-conan-

      - name: Conan install
        shell: pwsh
        run: |
          conan install . --output-folder=build/Release --build=missing -pr:b=default -s build_type=Release -s compiler.cppstd=20

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/Release -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

      - name: sccache stats
        if: always()
        run: sccache --show-stats