name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_STARTUP_TIMEOUT: "60"

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Build Tools & Conan
        run: pip install "conan>=2.0,<3" ninja

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-default-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-default-conan-

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Conan install
        shell: pwsh
        run: |
          conan install . `
            --output-folder=build/Release `
            --build=missing `
            -pr:b=default `
            -s build_type=Release `
            -s compiler.cppstd=20

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build/Release -G Ninja `
            -DCMAKE_TOOLCHAIN_FILE="build/Release/generators/conan_toolchain.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        shell: pwsh
        run: cmake --build build/Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/Release --output-on-failure

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats || true