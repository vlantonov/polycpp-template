name: Package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang cppcheck rpm dpkg-dev

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Start sccache server
        run: |
          if ! sccache --start-server; then
            echo "SCCACHE_DISABLED=true" >> "$GITHUB_ENV"
            echo "::warning::sccache server failed to start (GHA cache unavailable), building without cache"
          fi

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-default-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-default-conan-

      - name: Conan install
        run: |
          mkdir -p build
          cd build
          conan install .. --build=missing -pr:b=default -s build_type=Release

      - name: List CMake presets (diagnostic)
        run: cmake --list-presets || true

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON \
            -DPOLYCPP_ENABLE_PACKAGING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build/Release

      - name: Package
        run: |
          cd build/Release
          cpack -G "DEB;RPM" -V

      - name: List package outputs
        run: ls -la build/Release/*.deb build/Release/*.rpm

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: polycpp-packages
          path: |
            build/Release/*.deb
            build/Release/*.rpm

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Release/*.deb
            build/Release/*.rpm
          generate_release_notes: true

      - name: sccache stats
        if: always()
        run: sccache --show-stats