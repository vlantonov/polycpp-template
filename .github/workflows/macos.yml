name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system tools
        run: brew install ninja

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.7

      # FIX 1: Health-check the cache backend, not just the server process.
      # sccache --start-server exits 0 even when the GHA cache storage is
      # broken. Probe with --show-stats (which actually exercises the backend)
      # and disable the launchers if it fails.
      - name: Start sccache server
        run: |
          if sccache --start-server && sccache --show-stats > /dev/null 2>&1; then
            echo "SCCACHE_LAUNCHER=sccache" >> "$GITHUB_ENV"
          else
            sccache --stop-server > /dev/null 2>&1 || true
            echo "SCCACHE_LAUNCHER=" >> "$GITHUB_ENV"
            echo "::warning::sccache unavailable (cache backend degraded), building without cache"
          fi

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-default-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-default-conan-

      # FIX 2: --output-folder so conan writes generators into build/Release/,
      # matching the path CMake is given below.
      - name: Conan install
        run: |
          conan install . --output-folder=build/Release --build=missing -pr:b=default -s build_type=Release

      - name: List CMake presets (diagnostic)
        run: cmake --list-presets || true

      # FIX 3: Compiler launchers are only set when sccache is actually healthy.
      # Empty SCCACHE_LAUNCHER means the -D flags become "-D...=" which CMake
      # treats as "no launcher", so the compiler is invoked directly.
      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER="${SCCACHE_LAUNCHER}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="${SCCACHE_LAUNCHER}"

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true