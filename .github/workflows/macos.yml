name: macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: write

env:
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
  SCCACHE_STARTUP_TIMEOUT: "60"

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install system tools
        run: brew install ninja

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Conan
        run: pip install "conan>=2.0,<3"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Verify sccache daemon (fallback to local cache)
        run: |
          if ! sccache --show-stats > /dev/null 2>&1; then
            echo "sccache daemon not running, restarting with local cache"
            SCCACHE_GHA_ENABLED=false sccache --start-server || true
          fi

      - name: Cache Conan packages
        uses: actions/cache@v6
        with:
          path: ~/.conan2/p
          key: ${{ runner.os }}-default-conan-${{ hashFiles('conanfile.txt') }}
          restore-keys: |
            ${{ runner.os }}-default-conan-

      - name: Conan install
        run: |
          conan install . --output-folder=build/Release --build=missing -pr:b=default -s build_type=Release

      - name: List CMake presets (diagnostic)
        run: cmake --list-presets || true

      - name: Configure
        run: |
          cmake -S . -B build/Release -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DPOLYCPP_WARNINGS_AS_ERRORS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build/Release

      - name: Test
        run: ctest --test-dir build/Release --output-on-failure

      - name: sccache stats
        if: always()
        run: sccache --show-stats || true